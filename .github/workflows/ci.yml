name: CI

# Every push to a branch and every pull request builds the engine, the CLI, the DLL and the app, runs
# the engine's test executable and the app's tests, and packs the zip and the installer, so a change
# that breaks packaging is caught too. It publishes nothing: a broken commit is red here before anyone
# tags it. Tags are the release workflow's business.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Pinned rather than windows-latest, so the Visual C++ toolset (v143) doesn't move under the build.
    runs-on: windows-2025

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'app/**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build, test and pack
        shell: pwsh
        env:
          COMMIT: ${{ github.sha }}
        run: ./build.ps1 -Commit $env:COMMIT -Zip -Installer
