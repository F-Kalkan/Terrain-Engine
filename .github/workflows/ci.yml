name: CI

# Every push to a branch and every pull request builds the engine, the CLI, the DLL and the app, runs
# the engine's test executable and the app's tests, and packs the zip and the installer, so a change
# that breaks packaging is caught too. It publishes nothing: a broken commit is red here before anyone
# tags it. Tags are the release workflow's business.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Pinned rather than windows-latest, so the Visual C++ toolset (v143) doesn't move under the build.
    runs-on: windows-2025

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('app/**/*.csproj', 'app/**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build, test and pack
        shell: pwsh
        env:
          COMMIT: ${{ github.sha }}
        run: ./build.ps1 -Commit $env:COMMIT -Zip -Installer
