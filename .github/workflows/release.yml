name: Release

# Tag a commit to release it:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tagged commit is built from source, tested exactly as CI tests it, packed as a portable zip and an MSI
# installer, and published as a GitHub release. Any failed step -- a non-zero exit from the engine's test executable,
# a failing app test, anything else -- stops the job before the publish step, so nothing is released.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish
    runs-on: windows-2025

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The tag name reaches the script through the environment rather than by expression
      # substitution: a tag name may contain quotes, and pasting it into a shell would run them.
      - name: Resolve the version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like v1.0.0, got '$REF_NAME'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build, test and pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: ./build.ps1 -Version $env:VERSION -Commit $env:COMMIT -Zip -Installer

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: TerrainBench ${{ steps.version.outputs.version }}
          draft: false
          files: |
            artifacts/TerrainBench-${{ steps.version.outputs.version }}-win-x64.msi
            artifacts/TerrainBench-${{ steps.version.outputs.version }}-win-x64-portable.zip
          body: |
            Built and tested from commit ${{ github.sha }}.

            ## Install it

            1. Download **TerrainBench-${{ steps.version.outputs.version }}-win-x64.msi** and run it.
            2. It installs for your user only, under `%LOCALAPPDATA%\Programs\TerrainBench`, asks for no
               administrator rights, and adds **TerrainBench** to the Start menu (and to the desktop, if you tick
               that box). The last page can start it. A newer version replaces an older one.
            3. Remove it from **Settings > Apps > Installed apps**.

            ## Or run it without installing

            1. Download **TerrainBench-${{ steps.version.outputs.version }}-win-x64-portable.zip** and unzip it anywhere.
            2. Run **TerrainBench.exe**. The .NET runtime and the engine's C runtime are inside.

            Both hold the same files. On first start, choose **Open the Sample Tile** to load the bundled
            Grand Canyon tile.

            Windows x64 only (Windows 10 or 11).

            **SmartScreen.** The build isn't code signed, so Windows may show "Windows protected your PC" the
            first time, for the installer or the app. Choose **More info**, then **Run anyway** -- or check the
            source at this commit and build it yourself with `.\build.ps1 -Zip -Installer`.

            The About page shows this version and the commit above. **Copy Results** puts the inputs, the
            outputs, the version and the commit on the clipboard, ready to paste into an issue.
